# Minimal tach config for OSS CI workflow selection.
#
# Keep this local to the OSS package so `uv run tach map` from oss/ does not
# resolve the enclosing gr00t monorepo project.
interfaces = []
exclude = [
    "**/*__pycache__",
    "**/*egg-info",
    "**/docs",
    "**/venv",
]
source_roots = [
    ".",
]

[[modules]]
path = "groot"

[[modules]]
path = "tests"
depends_on = ["groot"]
