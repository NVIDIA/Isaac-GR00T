# OSS package GitLab CI configuration.

workflow:
  auto_cancel:
    on_new_commit: none
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_new_commit: interruptible
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

default:
  interruptible: true

stages:
  - premerge
  - staging

variables:
  CACHE_PREFIX: "v0"
  OSS_PACKAGE_DIR: "."
  PYTHONPATH: "./"
  UV_HTTP_TIMEOUT: "120"

include:
  - local: "ci/image.gitlab-ci.yml"
  - local: "ci/test.oss.gitlab-ci.yml"
