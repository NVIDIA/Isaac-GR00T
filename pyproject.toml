[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-groot-n2"
version = "0.1.0"
description = "Minimal OSS GR00T N2 package"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=0.36.0",
    "numpy==1.26.4",
    "pyyaml>=6.0.0",
    "ray[default]==2.56.1",
    "requests>=2.32.0",
    "tyro",
]

[project.optional-dependencies]
dev = [
    "boto3",
    "pytest>=7.4.0",
    "ruff==0.12.7",
    "tach>=0.35.0",
]
training = [
    "albumentations==1.4.18",
    "accelerate",
    "av",
    "blobfile",
    "boto3",
    "decord2",
    "deepspeed==0.18.8",
    "einops",
    "flash-attn==2.8.0.post2",
    "ftfy",
    "lmdb",
    "loguru",
    "lancedb",
    "matplotlib",
    "msgpack",
    "cryptography>=48.0.1",
    "msal",
    "multi-storage-client[boto3]==0.46.0",
    "ninja",
    "omegaconf",
    "opentelemetry-exporter-otlp-proto-http",
    "peft",
    "pillow",
    "polars>=1.0",
    "pyarrow",
    "pylance>=0.37.0",
    "pyzmq",
    "ray[train,default,tune]==2.56.1",
    "structlog",
    "tianshou==0.5.1",
    "tiktoken",
    "torch==2.7.1 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torch==2.11.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torchcodec>=0.5,<0.6 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torchcodec==0.15.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torchvision==0.22.1 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torchvision==0.26.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "transformers==4.57.6",
    "truststore",
    "wandb",
]
tensorrt = [
    "onnx>=1.20.0",
    "onnxscript",
    "tensorrt-cu12==10.16.1.11 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorrt-cu13==10.16.1.11 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Runtime, export, evaluation, and policy-server dependencies. N2 model registration currently
# imports data modules, so their import-time dependencies are also required here.
deployment = [
    "albumentations==1.4.18",
    "av",
    "boto3",
    "einops",
    "flash-attn==2.8.0.post2",
    "ftfy",
    "lancedb",
    "lmdb",
    "loguru",
    "matplotlib",
    "msgpack",
    "multi-storage-client[boto3]==0.46.0",
    "ninja",
    "opencv-python-headless==4.11.0.86",
    "pandas",
    "peft",
    "pillow",
    "polars>=1.0",
    "pyarrow",
    "pylance>=0.37.0",
    "pyzmq",
    "ray[default]==2.56.1",
    "scipy",
    "structlog",
    "torch==2.7.1 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torch==2.11.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torchcodec>=0.5,<0.6 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torchcodec==0.15.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torchvision==0.22.1 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torchvision==0.26.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "tqdm",
    "transformers==4.57.6",
]

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["groot*", "skills", "skills.autoresearch*"]

[tool.setuptools.package-data]
groot = ["**/*.yaml", "core/training/configs/deepspeed/zero2_config.json", "infra/benchmark/specs/*.json"]
"skills.autoresearch" = ["**/*.yaml"]

# x86_64 stays on the CUDA 12.8 index. Linux aarch64 (GB300 / DGX Station) takes the
# CUDA 13 wheels published on PyPI, which are the first torch builds with aarch64 GPU wheels.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform != 'linux' or platform_machine != 'aarch64'" },
    { index = "pypi", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchcodec = [
    { index = "pytorch-cu128", marker = "sys_platform != 'linux' or platform_machine != 'aarch64'" },
    { index = "pypi", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform != 'linux' or platform_machine != 'aarch64'" },
    { index = "pypi", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

# flash-attn's build downloads the GitHub wheel for the build's torch, and compiles from
# source where none is published, which includes every Linux aarch64 build.
[tool.uv.extra-build-dependencies]
flash-attn = [
    "ninja",
    "psutil",
    "torch==2.7.1 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torch==2.11.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# These TensorRT packages are platform stubs. Building one on the other
# architecture fails even though that architecture does not install it.
[[tool.uv.dependency-metadata]]
name = "tensorrt-cu12-libs"
version = "10.16.1.11"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13-libs"
version = "10.16.1.11"
requires-dist = []

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.python.org/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a GPU runtime and mounted model/data artifacts",
]
