[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-groot-n2"
version = "0.1.0"
description = "Minimal OSS GR00T N2 package"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=0.36.0",
    "numpy==1.26.4",
    "pyyaml>=6.0.0",
    "ray[default]==2.56.1",
    "requests>=2.32.0",
    "tyro",
]

[project.optional-dependencies]
dev = [
    "boto3",
    "pytest>=7.4.0",
    "ruff==0.12.7",
    "tach>=0.35.0",
]
training = [
    "albumentations==1.4.18",
    "accelerate",
    "av",
    "blobfile",
    "boto3",
    "decord2",
    "deepspeed==0.18.8",
    "einops",
    "flash-attn==2.8.0.post2",
    "ftfy",
    "lmdb",
    "loguru",
    "lancedb",
    "matplotlib",
    "msgpack",
    "cryptography>=48.0.1",
    "msal",
    "multi-storage-client[boto3]==0.46.0",
    "ninja",
    "omegaconf",
    "opentelemetry-exporter-otlp-proto-http",
    "peft",
    "pillow",
    "polars>=1.0",
    "pyarrow",
    "pylance>=0.37.0",
    "pyzmq",
    "ray[train,default,tune]==2.56.1",
    "structlog",
    "tianshou==0.5.1",
    "tiktoken",
    "torch==2.7.1",
    "torchcodec>=0.5,<0.6",
    "torchvision==0.22.1",
    "transformers==4.57.6",
    "truststore",
    "wandb",
]

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["groot*", "skills", "skills.autoresearch*"]

[tool.setuptools.package-data]
groot = ["**/*.yaml", "core/training/configs/deepspeed/zero2_config.json", "infra/benchmark/specs/*.json"]
"skills.autoresearch" = ["**/*.yaml"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.7.1"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.python.org/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a GPU runtime and mounted model/data artifacts",
]
