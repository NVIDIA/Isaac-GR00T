# Build the OSS dependency image for the package root selected by OSS_PACKAGE_DIR.

image.minimal:
  extends: .image
  stage: premerge
  needs:
    - job: image.base.minimal
      optional: true
  script:
    - export REGISTRY="nvcr.io/nvidian"
    - export IMAGE_NAME="groot-ci-minimal"
    - |
      ci/scripts/docker_buildx_push.sh \
        --registry "${REGISTRY}" \
        --image-name "${IMAGE_NAME}" \
        --dockerfile ci/images/minimal.Dockerfile \
        --cache-slug "${CI_COMMIT_REF_SLUG}" \
        --tag "${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
        --build-arg "BASE_MINIMAL_TAG=${CI_COMMIT_SHORT_SHA}" \
        --build-arg "OSS_PACKAGE_DIR=${OSS_PACKAGE_DIR}" \
        --platform linux/amd64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$POSTMERGE_TESTS == "true"'
    - if: '$POST_TRAIN_E2E_LEAF == "true"'
    - if: '$OPEN_LOOP_EVAL_E2E_LEAF == "true"'
  timeout: 30m
