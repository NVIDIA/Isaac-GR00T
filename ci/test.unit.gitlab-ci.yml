# OSS package unit tests.

test.unit:
  extends: .minimal
  stage: premerge
  needs:
    - image.minimal
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cd /tmp
    - >
      python -m pytest
      "$CI_PROJECT_DIR/$OSS_PACKAGE_DIR/tests/groot/infra"
      --junitxml "$CI_PROJECT_DIR/$OSS_PACKAGE_DIR/junit.xml"
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/$OSS_PACKAGE_DIR/junit.xml
  allow_failure: false
  timeout: 10m
