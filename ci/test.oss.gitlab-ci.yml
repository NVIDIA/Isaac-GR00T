# OSS package CPU unit and GPU functional tests, run in the images built from
# the user-facing docker/Dockerfile (ci/image.oss.gitlab-ci.yml). The GPU suite
# runs on x86_64 L40S in the amd64 image and on Linux aarch64 GB300 in the arm64 one.

.oss_image_job:
  stage: premerge
  retry:
    max: 2
    when:
      - runner_system_failure
      - script_failure
  allow_failure: false

test.oss.cpu:
  extends: .oss_image_job
  needs:
    - image.oss.amd64
  image:
    name: nvcr.io/nvidian/groot-ci-oss:${CI_COMMIT_SHORT_SHA}-amd64
    entrypoint: [""]
  tags:
    - ipp-group-gear
  variables:
    IPP_RUNNER_QUEUE_NAME: user-queue-cpu
    GIT_LFS_SKIP_SMUDGE: "1"
    # Runs the image checks in tests/test_dockerfile.py.
    GR00T_DOCKER_IMAGE_TESTS: "1"
  rules: &oss_test_rules
    # premerge rules
    - if: "$CI_COMMIT_MESSAGE =~ /OSS_TESTS=true/"
    - if: '$OSS_TESTS == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - oss/**/*
        - groot/core/**/*
        - groot/infra/**/*
        - docker/**/*
        - pyproject.toml
        - uv.lock
        - scripts/deployment/oss/installation.md
        - tests/oss/test_dockerfile.py
        - ci/sync/copybara_sync.py
        - ci/sync/public_export.py
        - ci/test.oss.gitlab-ci.yml
        - ci/image.gitlab-ci.yml
        - ci/image.oss.gitlab-ci.yml
        - ci/scripts/docker_buildx_push.sh
    # postmerge rules
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$POSTMERGE_TESTS == "true"'

  before_script:
    - &oss_package_before_script |
      if [ -d "$CI_PROJECT_DIR/oss" ]; then
        export OSS_PACKAGE_ROOT="$(mktemp -d)/package"
        python3 -m ci.sync.copybara_sync \
          --repo-root "$CI_PROJECT_DIR" \
          --export-oss-for-tests "$OSS_PACKAGE_ROOT"
      else
        export OSS_PACKAGE_ROOT="$CI_PROJECT_DIR/${OSS_PACKAGE_DIR:-.}"
      fi
      unset PYTHONPATH
      cd "$OSS_PACKAGE_ROOT"
      uv pip install --no-deps -e .
      python -c 'import os, pathlib, groot; package = pathlib.Path(groot.__file__).resolve(); root = pathlib.Path(os.environ["OSS_PACKAGE_ROOT"]).resolve(); assert package.is_relative_to(root), f"groot imported outside OSS export: {package}"'
    - uv sync --frozen --inexact --extra training --extra dev

  script:
    - |
      python -m pytest \
        "$OSS_PACKAGE_ROOT/tests/groot" \
        "$OSS_PACKAGE_ROOT/tests/skills" \
        "$OSS_PACKAGE_ROOT/tests/test_dockerfile.py" \
        -m "not gpu" \
        -vv \
        --tb=short \
        --durations=0 \
        -ra \
        --junitxml "$CI_PROJECT_DIR/junit.oss.cpu.xml"

  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/junit.oss.cpu.xml
  timeout: 60m

.oss_gpu_job:
  extends: .oss_image_job
  # A timed-out test must stay red rather than consume another GPU for a rerun.
  retry:
    max: 2
    when: runner_system_failure
  variables:
    GIT_LFS_SKIP_SMUDGE: "1"
    OSS_GPU_TRAIN_NUM_GPUS: "1"
    OSS_GPU_TRAIN_BATCH_SIZE: "1"
    OSS_GPU_TRAIN_MAX_STEPS: "2"
    OSS_GPU_EVAL_STEPS: "1"
    OSS_GPU_EVAL_ACTION_HORIZON: "2"
    OSS_GPU_EVAL_DENOISING_STEPS: "2"
    GR00T_DOCKER_IMAGE_TESTS: "1"
  rules: *oss_test_rules

  before_script:
    - *oss_package_before_script
    - &oss_gpu_sync uv sync --frozen --inexact --extra training --extra dev --extra tensorrt

  script:
    - |
      # Dump slow-test stacks after 5m; bound the entire pytest process, including
      # collection and shutdown, to 10m plus a 30s hard-kill grace period.
      # SIGABRT also dumps Python stacks; avoid writing a multi-GB core file.
      ulimit -c 0
      timeout --verbose --signal=ABRT --kill-after=30s 10m \
        python -u -X faulthandler -m pytest -s \
        -o faulthandler_timeout=300 \
        "$OSS_PACKAGE_ROOT/tests/groot" \
        "$OSS_PACKAGE_ROOT/tests/test_dockerfile.py" \
        -m gpu \
        -vv \
        --tb=short \
        --durations=0 \
        -ra \
        --junitxml "$CI_PROJECT_DIR/junit.oss.gpu.xml"

  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/junit.oss.gpu.xml
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        # Diagnostics must not hang on an unresponsive GPU driver themselves.
        timeout --kill-after=5s 10s nvidia-smi || true
        timeout --kill-after=5s 10s ps -eo pid,ppid,stat,etimes,pcpu,pmem,comm || true
      fi
  # Leave room for image/setup work, bounded diagnostics, and artifact upload.
  timeout: 20m

test.oss.gpu.l40s:
  extends: .oss_gpu_job
  needs:
    - image.oss.amd64
  image:
    name: nvcr.io/nvidian/groot-ci-oss:${CI_COMMIT_SHORT_SHA}-amd64
    entrypoint: [""]
  tags:
    - ipp-group-gear
  variables:
    IPP_RUNNER_QUEUE_NAME: user-queue-gpu
    IPP_RUNNER_GPU_REQUEST: "1"
    IPP_RUNNER_GPU_LIMIT: "1"
    IPP_RUNNER_GPU_TYPE: NVIDIA-L40S
    # The IPP default is 4Gi, which the tensorrt sync and N2 training exceed.
    IPP_RUNNER_CPU_REQUEST: "16"
    IPP_RUNNER_CPU_LIMIT: "16"
    IPP_RUNNER_MEMORY_REQUEST: 64Gi
    IPP_RUNNER_MEMORY_LIMIT: 64Gi
    # n2_oss_pretrain defines only the h100 and gb300 compute families; h100 is
    # the x86 one, and OSS_GPU_TRAIN_BATCH_SIZE overrides its batch size.
    OSS_GPU_COMPUTE_TYPE: "h100"
    # AdamW state for the full N2 model does not fit in the L40S's 48 GB; SGD
    # keeps the same forward and backward kernels without optimizer state.
    OSS_GPU_TRAIN_OPTIM: "sgd"

test.oss.gpu.gb300:
  extends: .oss_gpu_job
  needs:
    - image.oss.arm64
  image:
    name: nvcr.io/nvidian/groot-ci-oss:${CI_COMMIT_SHORT_SHA}-arm64
    entrypoint: [""]
  tags:
    - cpu/arm64
    - gpu/gb300
  variables:
    OSS_GPU_COMPUTE_TYPE: "gb300"
  # Native GB300 runners report FIPS, and the OSS image has no FIPS provider.
  before_script:
    - |
      unset OPENSSL_FORCE_FIPS_MODE OPENSSL_FIPS_MODE_SWITCH_PATH
      if [ "$(head -c 1 /proc/sys/crypto/fips_enabled 2>/dev/null || true)" = "1" ]; then
        echo "Masking runner host FIPS mode for the non-FIPS OSS training image"
        printf '0\n' > /tmp/groot-ci-fips-disabled
        chmod 0444 /tmp/groot-ci-fips-disabled
        if ! mount --bind /tmp/groot-ci-fips-disabled /proc/sys/crypto/fips_enabled; then
          echo "Failed to mask inherited runner FIPS mode" >&2
          exit 1
        fi
        test "$(head -c 1 /proc/sys/crypto/fips_enabled)" = "0"
      fi
    - *oss_package_before_script
    - *oss_gpu_sync

build.oss.dependencies:
  stage: premerge
  needs:
    - image.oss.amd64
  image:
    name: nvcr.io/nvidian/groot-ci-oss:${CI_COMMIT_SHORT_SHA}-amd64
    entrypoint: [""]
  tags:
    - ipp-group-gear
  variables:
    IPP_RUNNER_QUEUE_NAME: user-queue-cpu
    GIT_LFS_SKIP_SMUDGE: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$POSTMERGE_TESTS == "true"'
  before_script:
    - *oss_package_before_script
  script:
    - uv lock --locked --project .
    - |
      # The image pins uv to its system Python; deployment projects such as Thor
      # declare their own Python, which uv downloads to resolve their locks.
      for lockfile in scripts/deployment/*/uv.lock; do
        [ -f "$lockfile" ] || continue
        env -u UV_PYTHON UV_PYTHON_DOWNLOADS=automatic \
          uv lock --locked --project "${lockfile%/uv.lock}" || exit 1
      done
  retry:
    max: 2
    when: runner_system_failure
  timeout: 10m
