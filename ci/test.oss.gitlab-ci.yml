# OSS package CPU unit and mocked functional tests.

test.oss.cpu:
  extends: .minimal
  stage: premerge
  needs:
    - image.minimal
  rules: &oss_test_rules
    # premerge rules
    - if: "$CI_COMMIT_MESSAGE =~ /OSS_TESTS=true/"
    - if: '$OSS_TESTS == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - oss/**/*
        - groot/core/**/*
        - groot/infra/**/*
        - docker/**/*
        - pyproject.toml
        - ci/test.oss.gitlab-ci.yml
        - ci/image.minimal.gitlab-ci.yml
        - ci/images/minimal.Dockerfile
        - ci/image.train.gitlab-ci.yml
        - ci/images/train.Dockerfile
    # postmerge rules
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$POSTMERGE_TESTS == "true"'

  before_script: &oss_package_before_script
    - |
      if [ -z "${OSS_PACKAGE_DIR:-}" ]; then
        if [ -d "$CI_PROJECT_DIR/oss" ]; then
          export OSS_PACKAGE_DIR=oss
        else
          export OSS_PACKAGE_DIR=.
        fi
      fi
      export OSS_PACKAGE_ROOT="$CI_PROJECT_DIR/$OSS_PACKAGE_DIR"
      cd "$OSS_PACKAGE_ROOT"
      uv pip install --no-deps -e .

  script:
    - |
      python -m pytest \
        "$OSS_PACKAGE_ROOT/tests/groot" \
        -m "not gpu" \
        --junitxml "$CI_PROJECT_DIR/junit.oss.cpu.xml"

  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/junit.oss.cpu.xml

  retry:
    max: 2
    when:
      - runner_system_failure
      - script_failure
  allow_failure: false
  timeout: 30m

test.oss.gpu:
  stage: premerge
  needs:
    - image.train
  image:
    name: nvcr.io/nvidian/groot-ci-train:${CI_COMMIT_SHORT_SHA}
    entrypoint: [""]
  tags:
    - cpu/arm64
    - gpu/gb300
  variables:
    GROOT_OSS_GPU_FUNCTIONAL_TESTS: "1"
    OSS_GPU_COMPUTE_TYPE: "gb300"
    OSS_GPU_TRAIN_NUM_GPUS: "1"
    OSS_GPU_TRAIN_BATCH_SIZE: "1"
    OSS_GPU_TRAIN_MAX_STEPS: "2"
  rules: *oss_test_rules

  before_script: *oss_package_before_script

  script:
    - |
      python -m pytest -s \
        "$OSS_PACKAGE_ROOT/tests/groot" \
        -m gpu \
        --junitxml "$CI_PROJECT_DIR/junit.oss.gpu.xml"

  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/junit.oss.gpu.xml

  retry:
    max: 2
    when:
      - runner_system_failure
      - script_failure
  allow_failure: false
  timeout: 120m
