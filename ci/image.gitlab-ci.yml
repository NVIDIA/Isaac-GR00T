# OSS CI images.

include:
  - local: ci/image.oss.gitlab-ci.yml

.image_build_retry:
  retry:
    max: 2
    when:
      - api_failure
      - job_execution_timeout
      - runner_system_failure
      - script_failure
      - stuck_or_timeout_failure

.image:
  extends: .image_build_retry
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  tags:
    - ipp-group-gear
  variables:
    IPP_RUNNER_QUEUE_NAME: user-queue-cpu
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    GIT_DEPTH: 1
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: none
    GIT_LFS_SKIP_SMUDGE: "1"
  before_script:
    - apk add --no-cache git-lfs
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git lfs install --local --force
    - git lfs pull --include="uv.lock" --exclude=""
    - mkdir -p $HOME/.docker
    - echo "$DOCKER_AUTH_CONFIG" > $HOME/.docker/config.json
    - docker info

.image_arm64:
  extends: .image
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
