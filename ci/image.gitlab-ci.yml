# OSS CI images.

include:
  - local: ci/image.base.minimal.gitlab-ci.yml
  - local: ci/image.minimal.gitlab-ci.yml
  - local: ci/image.train.gitlab-ci.yml

.image_build_retry:
  retry:
    max: 2
    when:
      - api_failure
      - job_execution_timeout
      - runner_system_failure
      - script_failure
      - stuck_or_timeout_failure

.image:
  extends: .image_build_retry
  image: docker:27
  tags:
    - cpu/amd64
    - os/linux
    - type/docker
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_DRIVER: overlay2
    GIT_DEPTH: 1
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: none
    GIT_LFS_SKIP_SMUDGE: "1"
  before_script:
    - mkdir -p $HOME/.docker
    - echo "$DOCKER_AUTH_CONFIG" > $HOME/.docker/config.json
    - docker info
    - docker buildx create --use --driver docker-container --name ci-builder

.minimal:
  image:
    name: nvcr.io/nvidian/groot-ci-minimal:${CI_COMMIT_SHORT_SHA}
    entrypoint: [""]
  tags:
    - cpu/amd64
    - os/linux
    - type/docker
  before_script:
    - cd "$CI_PROJECT_DIR/$OSS_PACKAGE_DIR"
    - uv pip install .[dev]
  retry:
    max: 2
    when: runner_system_failure

.base_minimal:
  image:
    name: nvcr.io/nvidian/groot-ci-base-minimal:${CI_COMMIT_SHORT_SHA}
    entrypoint: [""]
  tags:
    - cpu/amd64
    - os/linux
    - type/docker
  before_script:
    - export AWS_ACCESS_KEY_ID=$BUCKET_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$BUCKET_SECRET_ACCESS_KEY
    - export AWS_REGION=$BUCKET_REGION
  retry:
    max: 2
    when: runner_system_failure
