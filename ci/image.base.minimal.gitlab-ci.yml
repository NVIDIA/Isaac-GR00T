# Build the stable base minimal image for OSS CI.

image.base.minimal:
  extends: .image
  stage: premerge
  script:
    - export REGISTRY="nvcr.io/nvidian"
    - export IMAGE_NAME="groot-ci-base-minimal"
    - |
      ci/scripts/docker_buildx_push.sh \
        --registry "${REGISTRY}" \
        --image-name "${IMAGE_NAME}" \
        --dockerfile ci/images/base.minimal.Dockerfile \
        --cache-slug "${CI_COMMIT_REF_SLUG}" \
        --tag "${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
        --platform linux/amd64,linux/arm64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$POST_TRAIN_E2E_LEAF == "true"'
    - if: '$OPEN_LOOP_EVAL_E2E_LEAF == "true"'
  timeout: 60m
