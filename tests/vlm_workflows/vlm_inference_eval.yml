workflow:
  timeout:
    queue_timeout: 30m
    exec_timeout: 45m
  name: vlm-inference-eval
  resources:
    default:
      cpu: 15
      gpu: 1
      memory: 100Gi
      storage: 200Gi
  tasks:
  - name: run-vlm-inference-eval
    image: {{ IMAGE }}
    command: ["bash"]
    args: ["/tmp/entry.sh"]
    files:
    - path: /tmp/entry.sh
      contents: |
        #!/bin/bash
        set -e

        # OSMO workflow is non-interactive, so we need to source the venv and ros setup.bash.
        source /root/venv/bin/activate
        source /opt/ros/humble/setup.bash
        export GR00T_CI=1

        rm -rf /root/Projects/gr00t
        # this makes sure that we are using the latest code
        # fetching code using PAT token on Osmo
        export GIT_LFS_SKIP_SMUDGE=1
        git clone --depth 1 --branch {{ GROOT_COMMIT_BRANCH }} https://oauth2:{{ GITLAB_TOKEN }}@gitlab-master.nvidia.com/GR00T/gr00t/gr00t.git /root/Projects/gr00t
        cd /root/Projects/gr00t
        uv sync
        # --prerelease=allow because groot_cot depends on sglang 0.5.11,
        # which transitively pulls flash-attn-4>=4.0.0b9 (currently a
        # beta). The infer pyproject.toml has [tool.uv] prerelease="allow"
        # for `uv sync`/`uv lock`, but `uv pip install` honors only the
        # CLI flag, so it must be set here as well.
        uv pip install -e groot/vlm/robot/yam --prerelease=allow

        # Run integration test
        # Note: Test automatically cleans up sglang server in CI/OSMO environments
        bash groot/vlm/robot/yam/tests/run_integration_test.sh
