workflow:
  timeout:
    queue_timeout: 30m
    exec_timeout: 20m
  name: vlm-nanobot-dummy
  resources:
    default:
      cpu: 4
      gpu: 0
      memory: 16Gi
      storage: 50Gi
  tasks:
  - name: run-vlm-nanobot-dummy
    image: {{ IMAGE }}
    command: ["bash"]
    args: ["/tmp/entry.sh"]
    files:
    - path: /tmp/entry.sh
      contents: |
        #!/bin/bash
        set -e

        # OSMO workflow is non-interactive, so we need to source the venv.
        source /root/venv/bin/activate
        export GR00T_CI=1

        rm -rf /root/Projects/gr00t
        # Use the latest code for this branch (PAT token clone on Osmo).
        export GIT_LFS_SKIP_SMUDGE=1
        git clone --depth 1 --branch {{ GROOT_COMMIT_BRANCH }} https://oauth2:{{ GITLAB_TOKEN }}@gitlab-master.nvidia.com/GR00T/gr00t/gr00t.git /root/Projects/gr00t
        cd /root/Projects/gr00t
        uv sync
        # --prerelease=allow: groot_cot depends on sglang 0.5.11, which pulls a
        # flash-attn-4 beta; `uv pip install` honors only the CLI flag.
        uv pip install -e groot/vlm/robot/yam --prerelease=allow

        # CPU-only: exercises the nanobot hosting seam with the offline dummy
        # provider (no GPU, no Gemini). The script installs nanobot[agent-sync].
        bash groot/vlm/robot/yam/tests/run_nanobot_dummy_test.sh
