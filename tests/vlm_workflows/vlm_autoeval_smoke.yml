workflow:
  timeout:
    queue_timeout: 30m
    exec_timeout: 30m
  name: vlm-autoeval-smoke
  resources:
    default:
      cpu: 15
      gpu: 1
      memory: 100Gi
      storage: 200Gi
  tasks:
  - name: run-vlm-autoeval-smoke
    image: {{ IMAGE }}
    command: ["bash"]
    args: ["/tmp/entry.sh"]
    files:
    - path: /tmp/entry.sh
      contents: |
        #!/bin/bash
        set -e

        source /root/venv/bin/activate
        source /opt/ros/humble/setup.bash
        export GR00T_CI=1

        rm -rf /root/Projects/gr00t
        export GIT_LFS_SKIP_SMUDGE=1
        git clone --depth 1 --branch {{ GROOT_COMMIT_BRANCH }} https://oauth2:{{ GITLAB_TOKEN }}@gitlab-master.nvidia.com/GR00T/gr00t/gr00t.git /root/Projects/gr00t
        cd /root/Projects/gr00t

        # Install autoeval dependencies (separate uv project)
        cd groot/vlm/autoeval
        uv sync

        # Run autoeval smoke test: qwen3vl-2b on 10 blink samples, 1 GPU
        uv run python src/run.py \
          run_name=ci_smoke_test \
          model=qwen3_vl_2b \
          dataset=lmms_eval/blink_10 \
          compute=1gpu_local

        echo "Autoeval smoke test passed."
