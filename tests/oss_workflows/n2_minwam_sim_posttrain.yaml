workflow:
  timeout:
    queue_timeout: 30m
    exec_timeout: 90m
  name: oss-n2-minwam-sim-posttrain
  resources:
    default:
      cpu: 88
      gpu: 8
      memory: 900Gi
      storage: 800Gi
  tasks:
    - name: run-oss-n2-minwam-sim-posttrain
      image: {{ IMAGE }}
      credentials:
        {{ OSMO_AWS_CREDENTIAL_NAME }}:
          AWS_ACCESS_KEY_ID: aws_access_key_id
          AWS_SECRET_ACCESS_KEY: aws_secret_access_key
          AWS_DEFAULT_REGION: aws_default_region
          AWS_ENDPOINT_URL: aws_endpoint_url
        gear-data-credentials:
          GEAR_DATA_CREDENTIALS: data_credentials
      command: ["bash"]
      exitActions:
        RESCHEDULE: 3001
      args: ["/tmp/entry.sh"]
      files:
      - path: /tmp/entry.sh
        contents: |
          #!/bin/bash
          set -euo pipefail

          GROOT_REPOSITORY_URL="{{ GROOT_REPOSITORY_URL }}"
          GROOT_REPOSITORY_URL="${GROOT_REPOSITORY_URL%.git}.git"
          GROOT_REPOSITORY_DIR="$(basename "${GROOT_REPOSITORY_URL%.git}")"
          AUTHENTICATED_GROOT_REPOSITORY_URL="${GROOT_REPOSITORY_URL/https:\/\//https:\/\/oauth2:{{ GITLAB_TOKEN }}@}"

          GIT_LFS_SKIP_SMUDGE=1 git -c filter.lfs.smudge= -c filter.lfs.required=false clone \
            --branch {{ GROOT_COMMIT_BRANCH }} --single-branch --depth 1 --no-tags \
            --filter=blob:limit=8m \
            "${AUTHENTICATED_GROOT_REPOSITORY_URL}"

          cd "${GROOT_REPOSITORY_DIR}/{{ OSS_PACKAGE_DIR }}"

          export CLUSTER_TYPE=h100
          export NUM_NODES=1
          export NUM_GPUS=8
          export BATCH_SIZE=4
          export MAX_STEPS=2
          export DATALOADER_NUM_WORKERS=2
          export JOB_NAME=oss_n2_minwam_sim_posttrain_ci_${CI_COMMIT_SHORT_SHA:-manual}
          export USER_SLUG=ci

          export HF_HUB_OFFLINE=1
          export GIT_LFS_SKIP_SMUDGE=1
          export OTEL_SDK_DISABLED=true
          export WANDB_API_KEY=disabled
          export WANDB_MODE=disabled
          export NCCL_DEBUG=WARNING
          export NCCL_TIMEOUT=600
          export DECORD_EOF_RETRY_MAX=20480

          export AWS_ENDPOINT_URL=https://pdx.s8k.io
          export S3_ENDPOINT_URL=https://pdx.s8k.io

          # Keep this OSS integration test on Lustre-backed artifacts. The full
          # golden-run config publishes/prefetches Hugging Face artifacts, but
          # this smoke test should exercise the OSS package against the mounted
          # base model and dataset paths.
          unset GOLDEN_RUN_BASE_MODEL_REPO_ID
          unset GOLDEN_RUN_BASE_MODEL_REVISION
          unset GOLDEN_RUN_DATASET_REPO_ID
          unset GOLDEN_RUN_DATASET_REVISION
          unset GOLDEN_RUN_DATASET_LOCAL_NAME
          export PRETRAIN_CHECKPOINT=/mnt/amlfs-07/shared/checkpoints/ruijiez/n2_yam_pretrain-bidrectional-full-200k-source/checkpoint-200000
          export LFS_CACHE_PATH=/mnt/amlfs-01/shared
          export TRAINING_OUTPUT_DIR=/tmp/groot_outputs/${JOB_NAME}
          export COSMOS_MODEL_PATH=/mnt/amlfs-02/shared/ckpts/cosmos25/cosmos_reason1/
          export DIFFUSION_TRANSFORMER_PATH=/mnt/amlfs-02/shared/ckpts/cosmos25/Cosmos-Predict2.5-2B-diffusers/transformer
          export VAE_PATH=/mnt/amlfs-02/shared/ckpts/Wan2.1-I2V-14B-480P/Wan2.1_VAE.pth

          uv venv --python 3.12 .venv || uv venv .venv
          . .venv/bin/activate
          uv pip install "ray[train,default,tune]==2.48.0"
          uv pip install --index-url https://download.pytorch.org/whl/cu128 --extra-index-url https://pypi.python.org/simple "torch==2.7.1"
          uv pip install ninja packaging
          uv pip install --no-build-isolation-package flash-attn ".[training]"

          ray start \
            --head \
            --num-gpus="${NUM_GPUS}" \
            --num-cpus=88 \
            --disable-usage-stats \
            --include-dashboard=False
          sleep 5

          python -m groot.core.training.scripts.n2.golden.launch_n2_minwam_sim_oss_golden run
