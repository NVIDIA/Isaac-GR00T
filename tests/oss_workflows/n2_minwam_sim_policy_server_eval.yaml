workflow:
  timeout:
    queue_timeout: 30m
    exec_timeout: 90m
  name: oss-n2-minwam-sim-policy-server-eval
  resources:
    default:
      cpu: 15
      gpu: 1
      memory: 120Gi
      storage: 400Gi
  tasks:
    - name: run-oss-n2-minwam-sim-policy-server-eval
      image: "{{ IMAGE }}"
      command: ["bash"]
      exitActions:
        RESCHEDULE: 3001
      args: ["/tmp/entry.sh"]
      files:
      - path: /tmp/entry.sh
        contents: |
          #!/bin/bash
          set -euo pipefail

          GROOT_REPOSITORY_URL="{{ GROOT_REPOSITORY_URL }}"
          GROOT_REPOSITORY_URL="${GROOT_REPOSITORY_URL%.git}.git"
          GROOT_REPOSITORY_DIR="$(basename "${GROOT_REPOSITORY_URL%.git}")"
          AUTHENTICATED_GROOT_REPOSITORY_URL="${GROOT_REPOSITORY_URL/https:\/\//https:\/\/oauth2:{{ GITLAB_TOKEN }}@}"

          GIT_LFS_SKIP_SMUDGE=1 git -c filter.lfs.smudge= -c filter.lfs.required=false clone \
            --branch {{ GROOT_COMMIT_BRANCH }} --single-branch --depth 1 --no-tags \
            --filter=blob:limit=8m \
            "${AUTHENTICATED_GROOT_REPOSITORY_URL}"

          cd "${GROOT_REPOSITORY_DIR}/{{ OSS_PACKAGE_DIR }}"

          export FINAL_CHECKPOINT_PATH="{{ FINAL_CHECKPOINT_PATH }}"
          export OPEN_LOOP_EVAL_MODEL_PATH="{{ OPEN_LOOP_EVAL_MODEL_PATH }}"
          export OPEN_LOOP_EVAL_CHECKPOINT_NAME="{{ OPEN_LOOP_EVAL_CHECKPOINT_NAME }}"
          export OPEN_LOOP_EVAL_TRAJ_IDS="{{ OPEN_LOOP_EVAL_TRAJ_IDS }}"
          export OPEN_LOOP_EVAL_STEPS="{{ OPEN_LOOP_EVAL_STEPS }}"
          export OPEN_LOOP_EVAL_ACTION_HORIZON="{{ OPEN_LOOP_EVAL_ACTION_HORIZON }}"
          export OPEN_LOOP_EVAL_DENOISING_STEPS="{{ OPEN_LOOP_EVAL_DENOISING_STEPS }}"
          export OPEN_LOOP_EVAL_SERVER_PARITY_TOLERANCE="{{ OPEN_LOOP_EVAL_SERVER_PARITY_TOLERANCE }}"
          export HF_TOKEN="{{ HF_TOKEN }}"
          export HUGGING_FACE_HUB_TOKEN="{{ HUGGING_FACE_HUB_TOKEN }}"
          export HUGGINGFACE_TOKEN="{{ HUGGINGFACE_TOKEN }}"
          export HF_TOKEN="${HF_TOKEN:-${HUGGING_FACE_HUB_TOKEN:-${HUGGINGFACE_TOKEN:-}}}"
          export HF_HUB_OFFLINE=0
          export GIT_LFS_SKIP_SMUDGE=1
          export OTEL_SDK_DISABLED=true
          export CUDA_VISIBLE_DEVICES=0
          export GROOT_HF_ARTIFACT_CACHE_ROOT=/tmp/groot_hf_artifacts
          export COSMOS_MODEL_PATH="${COSMOS_MODEL_PATH:-/mnt/amlfs-02/shared/ckpts/cosmos25/cosmos_reason1/}"
          export DIFFUSION_TRANSFORMER_PATH="${DIFFUSION_TRANSFORMER_PATH:-/mnt/amlfs-02/shared/ckpts/cosmos25/Cosmos-Predict2.5-2B-diffusers/transformer}"
          export VAE_PATH="${VAE_PATH:-/mnt/amlfs-02/shared/ckpts/Wan2.1-I2V-14B-480P/Wan2.1_VAE.pth}"

          uv venv --python 3.12 .venv || uv venv .venv
          . .venv/bin/activate
          uv pip install "ray[train,default,tune]==2.48.0"
          uv pip install --index-url https://download.pytorch.org/whl/cu128 --extra-index-url https://pypi.python.org/simple "torch==2.7.1"
          uv pip install ninja packaging
          uv pip install --no-build-isolation-package flash-attn ".[training]"

          eval "$(uv run --active -m groot.infra.ci.main.golden_train print-env \
            --run-type n2-minwam-sim \
            --compute-type h100 | sed 's/^/export /')"

          MODEL_ARGS=()
          if [ -n "${OPEN_LOOP_EVAL_MODEL_PATH:-}" ]; then
            MODEL_ARGS=(--model-path "$OPEN_LOOP_EVAL_MODEL_PATH")
          elif [ -n "${FINAL_CHECKPOINT_PATH:-}" ]; then
            if [[ "$FINAL_CHECKPOINT_PATH" == hf://model/* ]]; then
              MODEL_ARGS=(--model-uri "$FINAL_CHECKPOINT_PATH")
            else
              MODEL_ARGS=(--model-path "$FINAL_CHECKPOINT_PATH")
            fi
          fi

          EVAL_ARGS=(
            --checkpoint-name "${OPEN_LOOP_EVAL_CHECKPOINT_NAME:-checkpoint-100}"
            --traj-ids "${OPEN_LOOP_EVAL_TRAJ_IDS:-0}"
            --steps "${OPEN_LOOP_EVAL_STEPS:-30}"
            --action-horizon "${OPEN_LOOP_EVAL_ACTION_HORIZON:-30}"
            --embodiment-tag xdof_relative_eef_relative_joint
            --denoising-steps "${OPEN_LOOP_EVAL_DENOISING_STEPS:-4}"
            --server-port 5555
            --server-parity-tolerance "${OPEN_LOOP_EVAL_SERVER_PARITY_TOLERANCE:-0.02}"
            --output-json /tmp/oss_policy_server_eval.json
            --server-log-path /tmp/oss_policy_server.log
          )

          python -m groot.infra.eval.main.oss_open_loop_eval \
            "${MODEL_ARGS[@]}" \
            "${EVAL_ARGS[@]}"

          cat /tmp/oss_policy_server_eval.json
