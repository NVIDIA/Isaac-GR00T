[project]
name = "groot-simulator-libero-pro"
version = "0.1.0"
description = "Isolated LIBERO-PRO runtime for GR00T closed-loop evaluation"
requires-python = ">=3.10,<3.11"
dependencies = [
    "bddl==1.0.1",
    "easydict==1.13",
    "future==0.18.2",
    "gym==0.25.2",
    "gymnasium==1.2.3",
    "imageio[ffmpeg]==2.37.2",
    "matplotlib==3.5.3",
    "mujoco==3.4.0",
    "numpy==1.22.4",
    "opencv-python-headless>=4.10.0",
    "pyyaml>=6.0",
    "ray==2.56.1",
    "robomimic==0.2.0",
    "robosuite==1.4.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
