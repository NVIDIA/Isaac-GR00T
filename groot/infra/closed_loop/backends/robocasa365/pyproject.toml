[project]
name = "groot-simulator-robocasa365"
version = "0.1.0"
description = "Isolated RoboCasa365 runtime for GR00T closed-loop evaluation"
requires-python = ">=3.10,<3.11"
dependencies = [
    "gymnasium==1.2.0",
    "h5py",
    "hidapi",
    "imageio[ffmpeg]>=2.37.3",
    "lxml",
    "mujoco==3.3.1",
    "numba==0.61.2",
    "numpy==2.2.5",
    "opencv-python",
    "pillow",
    "pygame",
    "pynput",
    "pyyaml",
    "ray==2.56.1",
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@aaa8b9b214ce8e77e82926d677b4d61d55e577ab",
    "scipy==1.15.3",
    "termcolor",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "tqdm",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
