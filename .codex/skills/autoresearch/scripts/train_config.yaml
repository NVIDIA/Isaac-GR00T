# Template loaded by train_local.sh. Replace task-specific placeholders before use.
data:
  datasets:
    - dataset_paths:
        - /path/to/train_dataset
      mix_ratio: 1.0
      embodiment_tag: your_embodiment_tag
  modality_configs:
    your_embodiment_tag:
      video:
        delta_indices: [-20, -15, -10, -5, 0, 5, 10, 15, 20, 25, 30, 35, 40]
  seed: 24
  allow_padding: true
  video_backend: decord
  override_pretraining_statistics: true

training:
  start_from_checkpoint: /path/to/base_checkpoint
  max_steps: 10
  per_device_batch_size: 1
  num_gpus: 1
  dataloader_num_workers: 1
  learning_rate: 5.0e-5
  optim: adafactor
  save_steps: 100
  save_total_limit: 1
  experiment_tracking: disabled
  msc_profile_url: null
  enable_profiling: false
  use_async_checkpoint_save: false
  max_retries: 1
  output_dir: /path/to/training_output

model:
  model_type: GrootN2
  model_dtype: bfloat16
  model_size: 2B
  train_architecture: full
  image_target_size: [224, 320]
  tokenizer_path: nvidia/Cosmos-Reason1-7B
  cond_timestep: 0.1
  tiled: false
  view_embed_dim: 7
  max_n_cameras: 3
  video_scheduler_type: beta
  video_noise_beta_alpha: 7.0
  video_noise_beta_beta: 1.0
  video_noise_s: 0.999
  diffusion_model_cfg:
    model_size: 2B
  text_encoder_cfg:
    text_encoder_pretrained_path: nvidia/Cosmos-Reason1-7B
  vae_cfg: {}
  action_cfg:
    max_action_dim: 128
    max_state_dim: 128
    action_horizon: 40
    max_action_horizon: 40
    num_embodiments: 1
    use_percentiles: true
    clip_outliers: true
    apply_sincos_state_encoding: false
    state_dropout_prob: 0.5
    attention_mask_pattern:
      - [bidirectional_video_action_full, 1.0]
