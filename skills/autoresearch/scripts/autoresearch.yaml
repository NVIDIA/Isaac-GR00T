# Copy this file into your study folder and replace the source, baseline, and /path/to values.
# Stable study identifier used in trial IDs, branches, logs, and state.
study_id: your-study-id
workspace: /path/to/workspace # Root of the Git repository that AutoResearch edits.
output_dir: /path/to/study/runs # Directory for saving autoresearch results.
max_trials: 20 # Maximum number of candidate experiments, excluding the supplied baseline.
max_parallel_trials: 4 # Maximum number of trials launched concurrently in one search wave.
max_retry: 2 # Retries for failed agent, Git publish, training, or evaluation operations.
user_guidance: "" # Optional concise user-requested ideas and must/must-not-change constraints.

# Existing baseline artifacts, scripts, metric, and comparison rules.
baseline:
  train_script: /path/to/baseline/train.sh # Absolute path to the baseline training wrapper.
  eval_script: /path/to/baseline/eval.sh # Absolute path to the baseline evaluation wrapper.
  eval_result: /path/to/baseline/eval/results.json # Absolute path to the existing baseline result JSON.
  eval_metric: your.metric.path # Dot-separated path of the scalar score inside eval_result.
  direction: minimize # Whether lower (minimize) or higher (maximize) metric values are better.
  baseline_result: 0.0 # Metric result produced by the supplied baseline artifacts and scripts.
  min_delta: 0.0 # Smallest score improvement accepted as better than the reference trial.
  script_timeout_s: 86400 # Maximum runtime in seconds for each training or evaluation script invocation.

# Git source revision and candidate publication settings.
git:
  git_remote: origin
  base_branch: your-branch-name # Branch used as the baseline source.
  # Optional exact pin. If omitted, AutoResearch uses the locally visible head of base_branch.
  # base_commit: 0123456789abcdef0123456789abcdef01234567

# Repository paths the configured agent may modify while creating an experiment.
editable_paths:
  - skills/autoresearch/scripts/train_local.sh
  - skills/autoresearch/scripts/train_config.yaml
  - groot/core/training/models/
  - groot/core/training/experiment/
  - groot/core/training/configs/model/
  - groot/core/training/configs/training/
  - groot/core/training/configs/deepspeed/
  - tests/groot/core/training/

# Repository or dataset paths that the configured agent must never modify.
frozen_paths:
  - skills/autoresearch/scripts/launch_autoresearch.sh
  - skills/autoresearch/scripts/autoresearch.yaml
  - skills/autoresearch/scripts/eval_local.sh
  - skills/autoresearch/scripts/eval_config.yaml
  - groot/infra/
  - groot/core/training/open_loop/
  - groot/core/training/configs/training/open_loop_eval_config.py

# Research categories assigned to trials in repeating order.
idea_types:
  - recipe_tuning
  - history_ablation
  - inference_path_ablation
  - free_roam

# Coding agent used to propose and implement each candidate change.
agent:
  host: codex # "codex" or "claude".
  timeout_s: 3600
