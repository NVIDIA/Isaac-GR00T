default-values:
  # Workflow identity and runtime limits for the closed-loop smoke eval.
  WORKFLOW_NAME: n2-genie-sim-l40-eval
  EXEC_TIMEOUT: 4h
  QUEUE_TIMEOUT: 2h
  POLICY_IMAGE: nvcr.io/nvidia/pytorch:25.04-py3
  SIMULATOR_IMAGE: nvcr.io/nvidia/isaac-sim:4.5.0

  POLICY_CPU: 15
  POLICY_GPU: 1
  POLICY_MEMORY: 120Gi
  POLICY_STORAGE: 300Gi
  SIMULATOR_CPU: 15
  SIMULATOR_GPU: 1
  SIMULATOR_MEMORY: 120Gi
  SIMULATOR_STORAGE: 300Gi

  # Both pods clone GR00T so their task bodies can live in repo-tracked scripts.
  GROOT_ROOT: /workspace/gr00t
  SIM_GROOT_ROOT: /tmp/gr00t
  GROOT_BRANCH: main
  GROOT_REVISION: ""
  GROOT_REPO: github.com/NVIDIA/Isaac-GR00T-CRA.git
  OSS_PACKAGE_DIR: oss

  # Shared eval paths. The simulator writes live outputs under OSMO's output
  # volume, then copies summary artifacts back to EVAL_OUTPUT_DIR.
  AUTORESEARCH_ROOT: /tmp/autoresearch
  CHECKPOINT_PATH: ""
  EVAL_OUTPUT_DIR: ""
  GENIESIM_ROOT: ""

  # Keep these small for AutoResearch testing: one task, one episode, one
  # subtask cap.
  POLICY_PORT: 8000
  EMBODIMENT_TAG: agibot
  ACTION_HORIZON: 16
  DENOISING_STEPS: 4
  TASK_TYPE: if
  TASK_NAME: pick_billiards_color
  MAX_SUBTASKS: 1
  NUM_EPISODE: 1

workflow:
  name: {{ WORKFLOW_NAME }}
  timeout:
    queue_timeout: {{ QUEUE_TIMEOUT }}
    exec_timeout: {{ EXEC_TIMEOUT }}

  resources:
    policy:
      cpu: {{ POLICY_CPU }}
      gpu: {{ POLICY_GPU }}
      memory: {{ POLICY_MEMORY }}
      storage: {{ POLICY_STORAGE }}
    simulator:
      cpu: {{ SIMULATOR_CPU }}
      gpu: {{ SIMULATOR_GPU }}
      memory: {{ SIMULATOR_MEMORY }}
      storage: {{ SIMULATOR_STORAGE }}

  groups:
  - name: eval-group
    tasks:
    - name: policy-server
      image: {{ POLICY_IMAGE }}
      resource: policy
      command: ["bash", "-lc"]
      credentials:
        github-token: /tmp/github
      environment:
        ACCEPT_EULA: "Y"
        PRIVACY_CONSENT: "Y"
        NVIDIA_DRIVER_CAPABILITIES: graphics,compute,utility
      args:
      - |
        set -euo pipefail

        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl ffmpeg git
        rm -rf /var/lib/apt/lists/*
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="${HOME}/.local/bin:${PATH}"

        # Render OSMO template values into exported variables for the policy script.
        export GROOT_ROOT='{{ GROOT_ROOT }}'
        export GROOT_BRANCH='{{ GROOT_BRANCH }}'
        export GROOT_REVISION='{{ GROOT_REVISION }}'
        export GROOT_REPO='{{ GROOT_REPO }}'
        export OSS_PACKAGE_DIR='{{ OSS_PACKAGE_DIR }}'
        export AUTORESEARCH_ROOT='{{ AUTORESEARCH_ROOT }}'
        export CHECKPOINT_PATH='{{ CHECKPOINT_PATH }}'
        CHECKPOINT_PATH="${CHECKPOINT_PATH:-${AUTORESEARCH_ROOT}/genie_sim_osmo/baseline/training}"
        export POLICY_PORT='{{ POLICY_PORT }}'
        export EMBODIMENT_TAG='{{ EMBODIMENT_TAG }}'
        export ACTION_HORIZON='{{ ACTION_HORIZON }}'
        export DENOISING_STEPS='{{ DENOISING_STEPS }}'

        # Use OSMO-provided GitLab credentials without placing the token in logs.
        cat > /tmp/git-askpass <<'EOF'
        #!/usr/bin/env bash
        case "$1" in
          *Username*) echo x-access-token ;;
          *Password*) tr -d '\r\n' < /tmp/github/github-token ;;
        esac
        EOF
        chmod +x /tmp/git-askpass

        # Clone the repo and detach to the submitted commit when one is provided.
        mkdir -p "$(dirname "${GROOT_ROOT}")"
        rm -rf "${GROOT_ROOT}"
        GIT_ASKPASS=/tmp/git-askpass GIT_TERMINAL_PROMPT=0 GIT_LFS_SKIP_SMUDGE=1 \
          git -c filter.lfs.smudge= -c filter.lfs.required=false clone \
          --branch "${GROOT_BRANCH}" --single-branch --depth 1 --no-tags \
          --filter=blob:limit=8m \
          "https://${GROOT_REPO}" \
          "${GROOT_ROOT}"

        if [ -n "${GROOT_REVISION}" ]; then
          if ! git -C "${GROOT_ROOT}" checkout --detach "${GROOT_REVISION}" 2>/dev/null; then
            GIT_ASKPASS=/tmp/git-askpass GIT_TERMINAL_PROMPT=0 \
              git -C "${GROOT_ROOT}" fetch --depth 50 origin "${GROOT_BRANCH}"
            git -C "${GROOT_ROOT}" checkout --detach "${GROOT_REVISION}"
          fi
        fi

        # Run the policy server body from the checked-out repo.
        cd "${GROOT_ROOT}/${OSS_PACKAGE_DIR}"
        uv lock --check
        export ACTUAL_GROOT_REVISION="$(git rev-parse HEAD)"
        if [ -n "${GROOT_REVISION}" ] && [ "${ACTUAL_GROOT_REVISION}" != "${GROOT_REVISION}" ]; then
          echo "Expected revision ${GROOT_REVISION}, cloned ${ACTUAL_GROOT_REVISION}" >&2
          exit 1
        fi
        bash skills/autoresearch/examples/genie_sim_osmo/osmo_scripts/eval_policy_server.sh

    - name: simulator
      lead: true
      image: {{ SIMULATOR_IMAGE }}
      resource: simulator
      command: ["bash", "-lc"]
      credentials:
        github-token: /tmp/github
      environment:
        ACCEPT_EULA: "Y"
        PRIVACY_CONSENT: "Y"
        NVIDIA_DRIVER_CAPABILITIES: graphics,compute,utility
      args:
      - |
        set -euo pipefail

        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git sudo
        rm -rf /var/lib/apt/lists/*
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="${HOME}/.local/bin:${PATH}"

        # Render OSMO template values into exported variables for the simulator script.
        export GROOT_ROOT='{{ SIM_GROOT_ROOT }}'
        export GROOT_BRANCH='{{ GROOT_BRANCH }}'
        export GROOT_REVISION='{{ GROOT_REVISION }}'
        export GROOT_REPO='{{ GROOT_REPO }}'
        export OSS_PACKAGE_DIR='{{ OSS_PACKAGE_DIR }}'
        export AUTORESEARCH_ROOT='{{ AUTORESEARCH_ROOT }}'
        export POLICY_HOST='{{host:policy-server}}'
        export POLICY_PORT='{{ POLICY_PORT }}'
        export GENIESIM_ROOT='{{ GENIESIM_ROOT }}'
        export REQUESTED_EVAL_OUTPUT_DIR='{{ EVAL_OUTPUT_DIR }}'
        export CHECKPOINT_PATH='{{ CHECKPOINT_PATH }}'
        GENIESIM_ROOT="${GENIESIM_ROOT:-${AUTORESEARCH_ROOT}/geniesim}"
        REQUESTED_EVAL_OUTPUT_DIR="${REQUESTED_EVAL_OUTPUT_DIR:-${AUTORESEARCH_ROOT}/genie_sim_osmo/baseline/eval}"
        CHECKPOINT_PATH="${CHECKPOINT_PATH:-${AUTORESEARCH_ROOT}/genie_sim_osmo/baseline/training}"
        export TASK_TYPE='{{ TASK_TYPE }}'
        export TASK_NAME='{{ TASK_NAME }}'
        export MAX_SUBTASKS='{{ MAX_SUBTASKS }}'
        export NUM_EPISODE='{{ NUM_EPISODE }}'
        export WORKFLOW_NAME='{{ WORKFLOW_NAME }}'
        export OSMO_OUTPUT_DIR='{{output}}'

        # Use OSMO-provided GitLab credentials without placing the token in logs.
        cat > /tmp/git-askpass <<'EOF'
        #!/usr/bin/env bash
        case "$1" in
          *Username*) echo x-access-token ;;
          *Password*) tr -d '\r\n' < /tmp/github/github-token ;;
        esac
        EOF
        chmod +x /tmp/git-askpass

        # Clone the repo and detach to the submitted commit when one is provided.
        mkdir -p "$(dirname "${GROOT_ROOT}")"
        rm -rf "${GROOT_ROOT}"
        GIT_ASKPASS=/tmp/git-askpass GIT_TERMINAL_PROMPT=0 GIT_LFS_SKIP_SMUDGE=1 \
          git -c filter.lfs.smudge= -c filter.lfs.required=false clone \
          --branch "${GROOT_BRANCH}" --single-branch --depth 1 --no-tags \
          --filter=blob:limit=8m \
          "https://${GROOT_REPO}" \
          "${GROOT_ROOT}"

        if [ -n "${GROOT_REVISION}" ]; then
          if ! git -C "${GROOT_ROOT}" checkout --detach "${GROOT_REVISION}" 2>/dev/null; then
            GIT_ASKPASS=/tmp/git-askpass GIT_TERMINAL_PROMPT=0 \
              git -C "${GROOT_ROOT}" fetch --depth 50 origin "${GROOT_BRANCH}"
            git -C "${GROOT_ROOT}" checkout --detach "${GROOT_REVISION}"
          fi
        fi

        # Run the simulator body from the checked-out repo.
        cd "${GROOT_ROOT}/${OSS_PACKAGE_DIR}"
        uv lock --check
        export ACTUAL_GROOT_REVISION="$(git rev-parse HEAD)"
        if [ -n "${GROOT_REVISION}" ] && [ "${ACTUAL_GROOT_REVISION}" != "${GROOT_REVISION}" ]; then
          echo "Expected revision ${GROOT_REVISION}, cloned ${ACTUAL_GROOT_REVISION}" >&2
          exit 1
        fi
        bash skills/autoresearch/examples/genie_sim_osmo/osmo_scripts/eval_simulator.sh
