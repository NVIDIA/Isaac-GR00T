study_id: yam-stack-bowl-local
workspace: ${AUTORESEARCH_ROOT}/gr00t
max_trials: 5
max_parallel_trials: 1
max_retry: 2
output_dir: ${AUTORESEARCH_ROOT}/yam_stack_bowl/study

baseline:
  script_timeout_s: 7200
  train_script: ${AUTORESEARCH_ROOT}/gr00t/oss/skills/autoresearch/examples/yam_stack_bowl/train_baseline.sh
  eval_script: ${AUTORESEARCH_ROOT}/gr00t/oss/skills/autoresearch/examples/yam_stack_bowl/eval_baseline.sh
  eval_result: ${AUTORESEARCH_ROOT}/yam_stack_bowl/baseline/eval/results.json
  eval_metric: results.local.average.mse
  direction: minimize
  baseline_result: 0.010261768475174904
  min_delta: 0.0

git:
  git_remote: origin
  base_branch: main

agent:
  host: codex
  executable: codex
  model: gpt-5.6-sol
  timeout_s: 3600
  sandbox: danger-full-access

editable_paths:
  - oss/skills/autoresearch/examples/yam_stack_bowl/train_config.yaml
  - oss/groot/core/training/models/
  - groot/core/training/models/
  - oss/groot/core/training/experiment/
  - groot/core/training/experiment/
  - oss/groot/core/training/configs/model/
  - groot/core/training/configs/model/
  - oss/groot/core/training/configs/training/
  - oss/groot/core/training/configs/deepspeed/
  - oss/tests/groot/core/training/

frozen_paths:
  - oss/skills/autoresearch/examples/yam_stack_bowl/train_baseline.sh
  - oss/skills/autoresearch/examples/yam_stack_bowl/eval_baseline.sh
  - oss/skills/autoresearch/examples/yam_stack_bowl/eval_config.yaml
  - oss/skills/autoresearch/examples/yam_stack_bowl/autoresearch.yaml
  - oss/skills/autoresearch/scripts/train_local.sh
  - oss/skills/autoresearch/scripts/eval_local.sh
  - oss/groot/infra/
  - groot/infra/
  - oss/groot/core/training/open_loop/
  - groot/core/training/open_loop/
  - oss/groot/core/training/configs/training/open_loop_eval_config.py

locked_train_config:
  path: oss/skills/autoresearch/examples/yam_stack_bowl/train_config.yaml
  eval_dataset_paths:
    - ${AUTORESEARCH_ROOT}/yam_stack_bowl/datasets/eval

idea_types:
  - recipe_tuning
  - history_ablation
  - inference_path_ablation
  - free_roam
